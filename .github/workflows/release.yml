name: Release qualification

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify release tag and source commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build tagged source
        run: npm run build
      - name: Package build and record SHA-256
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tar -czf "voltwise-${RELEASE_TAG}-${RELEASE_SHA}.tar.gz" dist
          sha256sum "voltwise-${RELEASE_TAG}-${RELEASE_SHA}.tar.gz" > "voltwise-${RELEASE_TAG}-${RELEASE_SHA}.tar.gz.sha256"
          echo "Release source SHA: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat "voltwise-${RELEASE_TAG}-${RELEASE_SHA}.tar.gz.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voltwise-${{ github.ref_name }}-${{ github.sha }}
          path: |
            voltwise-${{ github.ref_name }}-${{ github.sha }}.tar.gz
            voltwise-${{ github.ref_name }}-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
